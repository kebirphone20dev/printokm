<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>لوحة الإدارة | printokm</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Segoe UI", Tahoma, Arial, sans-serif; background: #f3f4f6; color: #1f2937; padding: 20px; }
    .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    h1 { color: #134e4a; font-size: 1.3rem; }
    .panel { background: #fff; border-radius: 12px; padding: 16px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 560px; }
    th { background: #0f766e; color: #fff; padding: 10px; text-align: right; }
    td { padding: 8px; border-bottom: 1px solid #e5e7eb; }
    input, select { padding: 7px; border: 1px solid #d1d5db; border-radius: 6px; font: inherit; }
    input[type=number] { width: 90px; }
    button { padding: 8px 14px; background: #0f766e; color: #fff; border: 0; border-radius: 6px; font: inherit; cursor: pointer; }
    button.out { background: #e5e7eb; color: #1f2937; }
    #msg { margin-bottom: 12px; padding: 10px; border-radius: 8px; display: none; }
    .ok { background: #dcfce7; color: #166534; }
    .err { background: #fee2e2; color: #b91c1c; }
  </style>
</head>
<body>
  <div class="top">
    <h1>لوحة الإدارة: الحسابات</h1>
    <div>
      <a href="index.html" style="margin-inline-end:12px">الموقع</a>
      <button class="out" onclick="logout()">خروج</button>
    </div>
  </div>

  <div id="msg"></div>

  <div class="panel">
    <table>
      <thead><tr><th>الإيميل</th><th>الدور</th><th>الرصيد</th><th>تاريخ التسجيل</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="auth.js"></script>
  <script>
    const msg = (t, ok) => {
      const m = document.getElementById("msg");
      m.textContent = t; m.className = ok ? "ok" : "err"; m.style.display = "block";
    };

    async function load() {
      const me = await requireAdmin();
      if (!me) return;

      const { data, error } = await sb.from("profiles").select("*").order("created_at", { ascending: false });
      if (error) return msg(error.message, false);

      const tb = document.getElementById("rows");
      tb.innerHTML = "";
      data.forEach(u => {
        const tr = document.createElement("tr");

        const tdEmail = document.createElement("td");
        tdEmail.textContent = u.email || "";

        const tdRole = document.createElement("td");
        const sel = document.createElement("select");
        ["client", "admin"].forEach(r => {
          const o = document.createElement("option");
          o.value = r; o.textContent = r; if (u.role === r) o.selected = true;
          sel.appendChild(o);
        });
        if (u.id === me.id) sel.disabled = true; // ما تنزّلش نفسك
        tdRole.appendChild(sel);

        const tdCr = document.createElement("td");
        const cr = document.createElement("input");
        cr.type = "number"; cr.min = "0"; cr.value = u.credits;
        tdCr.appendChild(cr);

        const tdDate = document.createElement("td");
        tdDate.textContent = new Date(u.created_at).toLocaleDateString("fr-FR");

        const tdBtn = document.createElement("td");
        const b = document.createElement("button");
        b.textContent = "حفظ";
        b.onclick = async () => {
          const credits = Math.max(0, parseInt(cr.value, 10) || 0);
          const { error } = await sb.from("profiles").update({ role: sel.value, credits }).eq("id", u.id);
          error ? msg(error.message, false) : msg("تم الحفظ: " + u.email, true);
        };
        tdBtn.appendChild(b);

        tr.append(tdEmail, tdRole, tdCr, tdDate, tdBtn);
        tb.appendChild(tr);
      });
    }
    load();
  </script>
</body>
</html>
