<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>مولّد الفواتير | printokm</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Segoe UI", Tahoma, Arial, sans-serif; background: #f3f4f6; color: #1f2937; }
    .wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 20px; }
    @media (max-width: 900px) { .wrap { grid-template-columns: 1fr; } }
    .panel { background: #fff; border-radius: 12px; padding: 20px; }
    h2 { color: #0f766e; margin-bottom: 12px; }
    h4 { margin: 16px 0 6px; color: #134e4a; }
    label { display: block; margin: 8px 0 3px; font-weight: 600; font-size: .85rem; }
    input, select {
      width: 100%; padding: 9px; border: 1px solid #d1d5db;
      border-radius: 8px; font: inherit;
    }
    .row { display: grid; grid-template-columns: 3fr 1fr 1.4fr auto; gap: 6px; margin-bottom: 6px; }
    .btn {
      margin-top: 12px; padding: 11px 20px; background: #0f766e; color: #fff;
      border: 0; border-radius: 8px; font: inherit; font-weight: 700; cursor: pointer;
    }
    .btn.sec { background: #e5e7eb; color: #1f2937; }
    .btn.del { margin: 0; padding: 0 12px; background: #fee2e2; color: #b91c1c; }

    /* الفاتورة */
    #inv { background: #fff; padding: 32px; border-radius: 12px; direction: ltr; text-align: left;
           font-family: Arial, sans-serif; font-size: 14px; }
    #inv h1 { font-size: 26px; color: #134e4a; margin-bottom: 4px; }
    .top { display: flex; justify-content: space-between; gap: 20px; margin-bottom: 20px; }
    .box { flex: 1; font-size: 13px; line-height: 1.6; white-space: pre-line; }
    .box b { display: block; color: #0f766e; margin-bottom: 4px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th { background: #0f766e; color: #fff; padding: 8px; text-align: left; }
    td { padding: 8px; border-bottom: 1px solid #e5e7eb; }
    .r { text-align: right; }
    .tot { margin-top: 14px; margin-left: auto; width: 280px; }
    .tot div { display: flex; justify-content: space-between; padding: 4px 0; }
    .tot .big { font-weight: 800; font-size: 16px; border-top: 2px solid #134e4a; margin-top: 4px; padding-top: 8px; }
    .words { margin-top: 18px; font-style: italic; line-height: 1.6; }

    @media print {
      body { background: #fff; }
      .no-print { display: none !important; }
      .wrap { display: block; padding: 0; }
      #inv { padding: 0; }
    }
  </style>

  <!-- حماية الدخول: امسح هذه الأسطر الثلاثة إذا تحب الصفحة مفتوحة للجميع -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="auth.js"></script>
  <script>requireAuth();</script>
</head>
<body>
<div class="wrap">

  <div class="panel no-print">
    <h2>بيانات الفاتورة</h2>

    <label>رقم الفاتورة</label>
    <input id="num" value="001/2026">
    <label>التاريخ</label>
    <input id="date" type="date">

    <h4>البائع (أنت)</h4>
    <label>الاسم / الشركة</label><input id="sName">
    <label>العنوان</label><input id="sAddr">
    <label>RC</label><input id="sRc">
    <label>NIF</label><input id="sNif">
    <label>NIS</label><input id="sNis">
    <label>A.I (رقم المادة)</label><input id="sAi">

    <h4>الزبون</h4>
    <label>الاسم</label><input id="cName">
    <label>العنوان</label><input id="cAddr">
    <label>NIF (اختياري)</label><input id="cNif">

    <h4>المنتجات / الخدمات</h4>
    <div id="items"></div>
    <button class="btn sec" onclick="addRow()">+ إضافة سطر</button>

    <label style="margin-top:14px">TVA</label>
    <select id="tva">
      <option value="0">0% (معفى)</option>
      <option value="9">9%</option>
      <option value="19" selected>19%</option>
    </select>

    <label>حقوق الطابع (Timbre) بالدينار، اتركه 0 إذا ما كانش</label>
    <input id="timbre" type="number" min="0" value="0">

    <button class="btn" onclick="window.print()">🖨️ طباعة / حفظ PDF</button>
    <button class="btn sec" onclick="location.href='index.html'">← الرئيسية</button>
    <button class="btn sec" onclick="logout()">خروج</button>
  </div>

  <div id="inv">
    <div class="top">
      <div><h1>FACTURE</h1><div>N° <span id="o-num"></span><br>Date : <span id="o-date"></span></div></div>
    </div>
    <div class="top">
      <div class="box"><b>Vendeur</b><span id="o-seller"></span></div>
      <div class="box"><b>Client</b><span id="o-client"></span></div>
    </div>
    <table>
      <thead><tr><th>Désignation</th><th class="r">Qté</th><th class="r">P.U. HT</th><th class="r">Total HT</th></tr></thead>
      <tbody id="o-rows"></tbody>
    </table>
    <div class="tot">
      <div><span>Total HT</span><span id="o-ht"></span></div>
      <div><span id="o-tvalabel">TVA</span><span id="o-tva"></span></div>
      <div id="o-timbrerow"><span>Timbre</span><span id="o-timbre"></span></div>
      <div class="big"><span>Total TTC</span><span id="o-ttc"></span></div>
    </div>
    <div class="words" id="o-words"></div>
  </div>

</div>

<script>
  /* ===== الأرقام بالحروف (فرنسية) ===== */
  const U = ["zéro","un","deux","trois","quatre","cinq","six","sept","huit","neuf","dix","onze","douze","treize","quatorze","quinze","seize"];
  const T = ["","","vingt","trente","quarante","cinquante","soixante"];
  const lt20 = n => n < 17 ? U[n] : "dix-" + U[n - 10];

  function lt100(n, pl) {
    if (n < 20) return lt20(n);
    if (n < 70) {
      const t = Math.floor(n / 10), u = n % 10;
      return u === 0 ? T[t] : u === 1 ? T[t] + " et un" : T[t] + "-" + U[u];
    }
    if (n < 80) return n === 71 ? "soixante et onze" : "soixante-" + lt20(n - 60);
    if (n === 80) return pl ? "quatre-vingts" : "quatre-vingt";
    return "quatre-vingt-" + lt20(n - 80);
  }

  function lt1000(n, pl) {
    const h = Math.floor(n / 100), r = n % 100;
    let s = "";
    if (h > 0) {
      s = h === 1 ? "cent" : U[h] + " cent";
      if (h > 1 && r === 0 && pl) s += "s";
    }
    if (r > 0) s += (s ? " " : "") + lt100(r, pl);
    return s;
  }

  function fr(n) {
    if (n === 0) return "zéro";
    const p = [];
    const mrd = Math.floor(n / 1e9), mil = Math.floor(n / 1e6) % 1000,
          th = Math.floor(n / 1e3) % 1000, r = n % 1000;
    if (mrd) p.push(mrd === 1 ? "un milliard" : lt1000(mrd, true) + " milliards");
    if (mil) p.push(mil === 1 ? "un million" : lt1000(mil, true) + " millions");
    if (th) p.push(th === 1 ? "mille" : lt1000(th, false) + " mille");
    if (r) p.push(lt1000(r, true));
    return p.join(" ");
  }

  function frMoney(n, c) {
    const parts = [];
    if (n > 0 || c === 0) parts.push(fr(n) + " dinar" + (n > 1 ? "s" : "") + " algérien" + (n > 1 ? "s" : ""));
    if (c > 0) parts.push(fr(c) + " centime" + (c > 1 ? "s" : ""));
    return parts.join(" et ");
  }

  /* ===== الفاتورة ===== */
  const $ = id => document.getElementById(id);
  const fmt = n => n.toLocaleString("fr-FR", {minimumFractionDigits: 2, maximumFractionDigits: 2}) + " DA";

  $("date").valueAsDate = new Date();

  function addRow() {
    const r = document.createElement("div");
    r.className = "row";
    r.innerHTML = `
      <input class="d" placeholder="الوصف">
      <input class="q" type="number" min="0" value="1">
      <input class="p" type="number" min="0" value="0">
      <button class="btn del" type="button">✕</button>`;
    r.querySelectorAll("input").forEach(i => i.addEventListener("input", render));
    r.querySelector("button").addEventListener("click", () => { r.remove(); render(); });
    $("items").appendChild(r);
    render();
  }

  function esc(s) {
    return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  function render() {
    $("o-num").textContent = $("num").value;
    $("o-date").textContent = $("date").value.split("-").reverse().join("/");

    $("o-seller").textContent = [$("sName").value, $("sAddr").value,
      $("sRc").value && "RC : " + $("sRc").value,
      $("sNif").value && "NIF : " + $("sNif").value,
      $("sNis").value && "NIS : " + $("sNis").value,
      $("sAi").value && "A.I : " + $("sAi").value].filter(Boolean).join("\n");

    $("o-client").textContent = [$("cName").value, $("cAddr").value,
      $("cNif").value && "NIF : " + $("cNif").value].filter(Boolean).join("\n");

    let ht = 0, html = "";
    document.querySelectorAll("#items .row").forEach(r => {
      const d = r.querySelector(".d").value;
      const q = parseFloat(r.querySelector(".q").value) || 0;
      const p = parseFloat(r.querySelector(".p").value) || 0;
      const t = q * p;
      ht += t;
      if (d || t) html += `<tr><td>${esc(d)}</td><td class="r">${q}</td><td class="r">${fmt(p)}</td><td class="r">${fmt(t)}</td></tr>`;
    });
    $("o-rows").innerHTML = html;

    const rate = parseFloat($("tva").value);
    const tva = ht * rate / 100;
    const timbre = parseFloat($("timbre").value) || 0;
    const ttc = ht + tva + timbre;

    $("o-ht").textContent = fmt(ht);
    $("o-tvalabel").textContent = "TVA " + rate + "%";
    $("o-tva").textContent = fmt(tva);
    $("o-timbre").textContent = fmt(timbre);
    $("o-timbrerow").style.display = timbre > 0 ? "flex" : "none";
    $("o-ttc").textContent = fmt(ttc);

    const tot = Math.round(ttc * 100);
    $("o-words").textContent = (tot > 0 && tot < 1e14)
      ? "Arrêtée la présente facture à la somme de : " + frMoney(Math.floor(tot / 100), tot % 100) + "."
      : "";
  }

  document.querySelectorAll("#num,#date,#sName,#sAddr,#sRc,#sNif,#sNis,#sAi,#cName,#cAddr,#cNif,#tva,#timbre")
    .forEach(el => el.addEventListener("input", render));

  addRow();
</script>
</body>
</html>
