<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>محوّل الأرقام إلى حروف | printokm</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Segoe UI", Tahoma, Arial, sans-serif; background: #f0fdfa; color: #1f2937; padding: 16px; }
    .box { max-width: 640px; margin: 0 auto; background: #fff; border-radius: 16px; padding: 24px;
           box-shadow: 0 8px 24px rgba(0,0,0,.08); }
    h1 { color: #134e4a; font-size: 1.3rem; margin-bottom: 4px; }
    .sub { color: #6b7280; font-size: .9rem; margin-bottom: 16px; }
    label { display: block; font-weight: 600; margin: 14px 0 6px; font-size: .9rem; }
    input { width: 100%; padding: 14px; font-size: 1.3rem; border: 2px solid #d1d5db; border-radius: 10px; direction: ltr; text-align: center; }
    input:focus { outline: none; border-color: #0f766e; }
    .out { background: #f0fdfa; border: 1px solid #99f6e4; border-radius: 10px; padding: 14px; min-height: 56px; line-height: 1.8; }
    #fr { direction: ltr; text-align: left; }
    button { margin-top: 8px; padding: 8px 16px; background: #0f766e; color: #fff; border: 0; border-radius: 8px; font: inherit; cursor: pointer; }
    a.back { display: inline-block; margin-top: 18px; color: #0f766e; }
  </style>
</head>
<body>
  <div class="box">
    <h1>محوّل الأرقام إلى حروف</h1>
    <div class="sub">اكتب المبلغ بالدينار الجزائري</div>

    <input id="amount" inputmode="decimal" placeholder="مثال: 125430.50" autofocus>

    <label>بالعربية</label>
    <div class="out" id="ar"></div>
    <button onclick="copyText('ar')">نسخ</button>

    <label>Français</label>
    <div class="out" id="fr"></div>
    <button onclick="copyText('fr')">Copier</button>

    <br><a class="back" href="index.html">← الصفحة الرئيسية</a>
  </div>

  <script>
    /* ===== الفرنسية ===== */
    const U = ["zéro","un","deux","trois","quatre","cinq","six","sept","huit","neuf","dix","onze","douze","treize","quatorze","quinze","seize"];
    const T = ["","","vingt","trente","quarante","cinquante","soixante"];
    const lt20 = n => n < 17 ? U[n] : "dix-" + U[n - 10];

    function lt100(n, pl) {
      if (n < 20) return lt20(n);
      if (n < 70) {
        const t = Math.floor(n / 10), u = n % 10;
        return u === 0 ? T[t] : u === 1 ? T[t] + " et un" : T[t] + "-" + U[u];
      }
      if (n < 80) return n === 71 ? "soixante et onze" : "soixante-" + lt20(n - 60);
      if (n === 80) return pl ? "quatre-vingts" : "quatre-vingt";
      return "quatre-vingt-" + lt20(n - 80);
    }

    function lt1000(n, pl) {
      const h = Math.floor(n / 100), r = n % 100;
      let s = "";
      if (h > 0) {
        s = h === 1 ? "cent" : U[h] + " cent";
        if (h > 1 && r === 0 && pl) s += "s";
      }
      if (r > 0) s += (s ? " " : "") + lt100(r, pl);
      return s;
    }

    function fr(n) {
      if (n === 0) return "zéro";
      const p = [];
      const mrd = Math.floor(n / 1e9), mil = Math.floor(n / 1e6) % 1000,
            th = Math.floor(n / 1e3) % 1000, r = n % 1000;
      if (mrd) p.push(mrd === 1 ? "un milliard" : lt1000(mrd, true) + " milliards");
      if (mil) p.push(mil === 1 ? "un million" : lt1000(mil, true) + " millions");
      if (th) p.push(th === 1 ? "mille" : lt1000(th, false) + " mille");
      if (r) p.push(lt1000(r, true));
      return p.join(" ");
    }

    /* ===== العربية ===== */
    const A1 = ["","واحد","اثنان","ثلاثة","أربعة","خمسة","ستة","سبعة","ثمانية","تسعة"];
    const A10 = ["عشرة","أحد عشر","اثنا عشر","ثلاثة عشر","أربعة عشر","خمسة عشر","ستة عشر","سبعة عشر","ثمانية عشر","تسعة عشر"];
    const AT = ["","","عشرون","ثلاثون","أربعون","خمسون","ستون","سبعون","ثمانون","تسعون"];
    const AH = ["","مئة","مئتان","ثلاثمئة","أربعمئة","خمسمئة","ستمئة","سبعمئة","ثمانمئة","تسعمئة"];

    function ar999(n) {
      const h = Math.floor(n / 100), r = n % 100, p = [];
      if (h) p.push(AH[h]);
      if (r) {
        if (r < 10) p.push(A1[r]);
        else if (r < 20) p.push(A10[r - 10]);
        else {
          const u = r % 10, t = Math.floor(r / 10);
          p.push(u ? A1[u] + " و" + AT[t] : AT[t]);
        }
      }
      return p.join(" و");
    }

    function arScale(g, one, two, plural, sing) {
      if (g === 1) return one;
      if (g === 2) return two;
      const l = g % 100;
      return ar999(g) + " " + (l >= 3 && l <= 10 ? plural : sing);
    }

    function ar(n) {
      if (n === 0) return "صفر";
      const p = [];
      const mrd = Math.floor(n / 1e9), mil = Math.floor(n / 1e6) % 1000,
            th = Math.floor(n / 1e3) % 1000, r = n % 1000;
      if (mrd) p.push(arScale(mrd, "مليار", "ملياران", "مليارات", "مليارًا"));
      if (mil) p.push(arScale(mil, "مليون", "مليونان", "ملايين", "مليونًا"));
      if (th) p.push(arScale(th, "ألف", "ألفان", "آلاف", "ألفًا"));
      if (r) p.push(ar999(r));
      return p.join(" و");
    }

    /* ===== المبلغ ===== */
    function arMoney(n, c) {
      const parts = [];
      if (n > 0) {
        const l = n % 100;
        parts.push(n === 1 ? "دينار جزائري واحد"
          : n === 2 ? "ديناران جزائريان"
          : ar(n) + " " + (l >= 3 && l <= 10 ? "دنانير جزائرية" : "دينارًا جزائريًا"));
      }
      if (c > 0) {
        parts.push(c === 1 ? "سنتيم واحد"
          : c === 2 ? "سنتيمان"
          : ar(c) + " " + (c >= 3 && c <= 10 ? "سنتيمات" : "سنتيمًا"));
      }
      return parts.length ? parts.join(" و") : "صفر دينار جزائري";
    }

    function frMoney(n, c) {
      const parts = [];
      if (n > 0 || c === 0) parts.push(fr(n) + " dinar" + (n > 1 ? "s" : "") + " algérien" + (n > 1 ? "s" : ""));
      if (c > 0) parts.push(fr(c) + " centime" + (c > 1 ? "s" : ""));
      const s = parts.join(" et ");
      return s.charAt(0).toUpperCase() + s.slice(1);
    }

    function update() {
      const raw = document.getElementById("amount").value.replace(/\s/g, "").replace(",", ".");
      const v = parseFloat(raw);
      const a = document.getElementById("ar"), f = document.getElementById("fr");
      if (isNaN(v) || v < 0 || v >= 1e12) { a.textContent = ""; f.textContent = ""; return; }
      const total = Math.round(v * 100);
      const n = Math.floor(total / 100), c = total % 100;
      a.textContent = arMoney(n, c);
      f.textContent = frMoney(n, c);
    }

    function copyText(id) {
      const t = document.getElementById(id).textContent;
      if (t) navigator.clipboard.writeText(t);
    }

    document.getElementById("amount").addEventListener("input", update);
  </script>
</body>
</html>
